---
- hosts: etcd_all
  strategy: linear
  any_errors_fatal: true
  tasks:
    - import_role:
        name: etcd3/facts
      vars:
        etcd_cluster_name: k8s
      tags:
         - etcd
         - etcd-facts

- hosts: etcd_all
  strategy: linear
  any_errors_fatal: true
  tasks:
    - import_role:
        name: etcd3/facts
      vars:
        etcd_cluster_name: k8s-events
      tags:
         - etcd
         - etcd-facts

- name: Gather facts
  hosts: cluster-all:etcd_all:calico_rr
  gather_facts: False
  tags: always
  tasks:
    - name: Gather and compute network facts
      import_role:
        name: network_facts
    - name: debug factts
      debug:
        msg: "ip: {{main_ips}}"

    - name: Gather minimal facts
      setup:
        gather_subset: '!all'

    # filter match the following variables:
    # ansible_default_ipv4
    # ansible_default_ipv6
    # ansible_all_ipv4_addresses
    # ansible_all_ipv6_addresses
    - name: Gather necessary facts (network)
      setup:
        gather_subset: '!all,!min,network'
        filter: "ansible_*_ipv[46]*"

    # filter match the following variables:
    # ansible_memtotal_mb
    # ansible_swaptotal_mb
    - name: Gather necessary facts (hardware)
      setup:
        gather_subset: '!all,!min,hardware'
        filter: "ansible_*total_mb"
